<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aircraft Route Planner</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <aside id="left-panel">
        <header>
          <h1>Aircraft Route Planner</h1>
        </header>

        <nav id="scope-tabs" role="tablist">
          <button data-scope="airport" class="active" role="tab">Airport-to-airport</button>
          <button data-scope="country" role="tab">Country-to-country</button>
        </nav>

        <section id="controls"></section>
        <section id="results"></section>
      </aside>

      <main id="map"></main>
    </div>

    <div id="popover" hidden></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
